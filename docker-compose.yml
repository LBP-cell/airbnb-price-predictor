services:
  backend:
    container_name: backend
    build: ./backend
    ports:
      - "7860:7860"
    volumes:
      - ./backend:/app
    networks:
      - airbnb_net

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - airbnb_net

networks:
  airbnb_net:
    driver: bridge
