version: '3.8'

services:
  backend:
    container_name: backend
    build: ./backend
    ports:
      - "7860:7860"
    volumes:
      - ./backend:/app

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
